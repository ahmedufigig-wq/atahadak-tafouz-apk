<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أتحداك تفوز</title>
<style>
html,body{margin:0;height:100%;background:#0b0d16;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}
#w{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}
canvas{width:100%;height:100%;display:block}
.cb{position:absolute;bottom:5%;width:12%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.65);color:#fff;font-size:5vmin;touch-action:none;padding:0}
.cb:active{background:rgba(255,255,255,.5)}
#bl{left:3%}#br{left:17%}#bj{right:3%;width:15%;background:rgba(255,90,54,.35)}
#mb{position:absolute;top:2%;left:50%;transform:translateX(-50%);width:auto;aspect-ratio:auto;bottom:auto;border-radius:10px;padding:2px 12px;font-size:4vmin}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vmin;background:linear-gradient(#2b1b5e,#7a3fa0 60%,#ff8a4c);text-align:center;padding:1vmin}
#ov h1{margin:0;font-size:7vmin;color:#ffd23f;text-shadow:0 .5vmin 0 #b0361f}
#ov p{margin:0;font-size:3.4vmin;min-height:4vmin}
#pr{display:flex;gap:2vmin}
.pb{width:24vmin;padding:2vmin 1vmin;border-radius:2vmin;border:.5vmin solid #ffd23f;color:#fff;font:inherit;font-size:3.4vmin;cursor:pointer}
.pb small{display:block;font-size:3vmin;margin-top:.8vmin}
.pb.lk{opacity:.45;filter:grayscale(1)}
#rot{display:none;position:fixed;inset:0;z-index:9;background:#10131c;align-items:center;justify-content:center;font-size:7vw}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="rot">🔄 دوّر جوالك أفقياً</div>
<div id="w">
<canvas id="c" width="640" height="360"></canvas>
<button class="cb" id="mb">☰ القائمة</button>
<button class="cb" id="bl">◀</button><button class="cb" id="br">▶</button><button class="cb" id="bj">⤒</button>
<div id="ov">
<svg style="height:20vmin" viewBox="0 0 96 96"><path d="M48 6 86 20v28c0 22-16 38-38 44C26 86 10 70 10 48V20Z" fill="#1b2030" stroke="#ffd23f" stroke-width="4"/><path d="M54 18 30 54h16l-4 24 26-38H50Z" fill="#ff5a36"/></svg>
<h1>أتحداك تفوز</h1><p id="m"></p><div id="pr"></div>
</div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=640,H=360;
const G=[0,320,640,40];
const LV=[
{n:"ثقة عمياء",s:[30,300],d:[580,300],p:[G],t:[{k:'spike',hid:1,x:300,y:306,w:28,h:14,a:250}]},
{n:"الأرض تختفي",s:[30,300],d:[590,300],p:[[0,320,220,40],[220,320,60,40],[280,320,360,40]],t:[{k:'vanish',i:1,a:190},{k:'spike',hid:1,x:420,y:306,w:28,h:14,a:380}]},
{n:"السماء غاضبة",s:[30,300],d:[590,300],p:[G],t:[{k:'drop',x:310,y:0,w:30,h:14,a:200},{k:'spike',hid:1,x:470,y:306,w:28,h:14,a:430}]},
{n:"جدار من العدم",s:[30,300],d:[590,300],p:[G],t:[{k:'wall',x:340,y:260,w:24,h:60,a:285},{k:'spike',hid:1,x:340,y:246,w:24,h:14,a:310}]},
{n:"الباب هرب",s:[300,300],d:[590,300],p:[G],t:[{k:'spike',hid:1,x:90,y:306,w:28,h:14,a:140,b:230},{k:'door',nx:40,ny:300,a:480}]},
{n:"فخ مزدوج",s:[30,300],d:[590,300],p:[G],t:[S(250,200),S(330,280)]},
{n:"حفرة",s:[30,300],d:[590,300],p:[[0,320,250,40],[330,320,310,40]],t:[S(480,430)]},
{n:"درج",s:[30,300],d:[440,120],p:[G,[150,260,90,12],[270,200,90,12],[400,140,100,12]],t:[{k:'spike',hid:1,x:300,y:186,w:28,h:14,a:270}]},
{n:"السقف",s:[30,300],d:[590,300],p:[G],t:[D(200,100),D(330,230),D(460,360)]},
{n:"جدارين",s:[30,300],d:[590,300],p:[G],t:[Wl(250,190),Wl(430,370),S(510,460)]},
{n:"الباب الهارب",s:[300,300],d:[590,300],p:[G,[200,260,70,12],[110,200,70,12],[20,140,80,12]],t:[M(40,120,480)]},
{n:"ممر الأشواك",s:[30,300],d:[590,300],p:[G],t:[F(150),F(260),F(370),F(480),S(550,500)]},
{n:"جسور",s:[30,300],d:[590,300],p:[[0,320,120,40],[190,320,70,40],[330,320,100,40],[470,320,170,40]],t:[S(385,335),S(560,520)]},
{n:"الأرض تنهار",s:[30,300],d:[590,300],p:[[0,320,240,40],[240,320,60,40],[300,320,60,40],[360,320,280,40]],t:[V(2,230),S(480,430)]},
{n:"ثلاثية",s:[30,300],d:[590,300],p:[G],t:[D(180,80),S(330,280),Wl(430,380),S(510,460)]},
{n:"صعود وهبوط",s:[30,300],d:[590,240],p:[G,[120,260,80,12],[240,200,80,12],[360,140,80,12],[480,200,80,12],[560,260,80,12]],t:[{k:'spike',hid:1,x:380,y:126,w:28,h:14,a:340},{k:'spike',hid:1,x:520,y:186,w:28,h:14,a:470}]}
];
function S(x,a,b){return{k:'spike',hid:1,x,y:306,w:28,h:14,a,b}}
function F(x){return{k:'spike',x,y:306,w:28,h:14,a:0}}
function V(i,a){return{k:'vanish',i,a}}
function D(x,a){return{k:'drop',x,y:0,w:30,h:14,a}}
function Wl(x,a){return{k:'wall',x,y:260,w:24,h:60,a}}
function M(nx,ny,a){return{k:'door',nx,ny,a}}
const NM=["مفاجأة","لا تتوقف","حذر","تسارع","الباب يهرب","فخ خفي","أعصاب","دقة","ممر ضيق","الكابوس","لا ثقة","سباق","صبر","جنون","تحدٍّ أخير","المحنة","النهاية قريبة","آخر خدعة","الباب الأخير","أتحداك تفوز"];
function gen(i){const m=i%5==0,xs=m?[120,230]:((i%3&&i<41)?[170,330,490]:[160,290,420,530]),t=[];
xs.forEach((x,j)=>{if(m){const k=(i+j)%3;t.push(k==0?S(x,x-50):k==1?Wl(x,x-60):F(x))}else{const k=(i*7+j*3)%4;t.push(k==0?S(x,x-50):k==1?D(x,x-100):k==2?Wl(x,x-60):F(x))}});
if(m)t.push(M(40,300,480));
return{n:NM[i-11]||"تحدٍّ "+i,s:m?[330,300]:[30,300],d:[590,300],p:[G],t}}
for(let i=17;i<=60;i++)LV.push(gen(i));

let L,P,K={},dead=0,lv=0,run=0,cd=0,done=0,T=0;
try{done=+localStorage.getItem('atf')||0}catch(e){}
const TH=[{n:"المروج",c:'#58c04a',s1:'#4fb7ff',s2:'#d8f3ff',g:'#58c04a',b:'#8a5a2b',o:'#ff5a36',h:'#4aa34a'},{n:"الصحراء",c:'#e8a23a',s1:'#ff7a45',s2:'#ffe0a0',g:'#f0c05a',b:'#a8672e',o:'#b02e2e',h:'#d9923b'},{n:"قلعة الليل",c:'#8d6bd1',s1:'#1b1442',s2:'#6a4aa0',g:'#9d7be0',b:'#3a2a63',o:'#ff4f8b',h:'#2b2060'}];
function load(){L=JSON.parse(JSON.stringify(levels()));L.t.forEach(t=>t.on=0);P={x:L.s[0],y:L.s[1],w:14,h:20,vx:0,vy:0,g:0}}
function levels(){return LV[lv]}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
const R=p=>({x:p[0],y:p[1],w:p[2],h:p[3]});
function die(){dead++;cd=25}
function step(){
if(cd){cd--;if(!cd)load();return}
P.vx=((K.r?1:0)-(K.l?1:0))*2.6;
P.x+=P.vx;
for(const p of L.p)if(p&&hit(P,R(p))){P.x=P.vx>0?p[0]-P.w:p[0]+p[2]}
P.x=Math.max(0,Math.min(W-P.w,P.x));
if(K.j&&P.g)P.vy=-9.5;
P.vy+=.5;P.y+=P.vy;P.g=0;
for(const p of L.p)if(p&&hit(P,R(p))){if(P.vy>0){P.y=p[1]-P.h;P.g=1}else P.y=p[1]+p[3];P.vy=0}
const cx=P.x+7;
for(const t of L.t){
if(!t.on&&cx>t.a&&(t.b==null||cx<t.b)){t.on=1;
if(t.k=='vanish')L.p[t.i]=null;
if(t.k=='wall')L.p.push([t.x,t.y,t.w,t.h]);
if(t.k=='door')L.d=[t.nx,t.ny];
if(t.k=='drop')t.vy=0}
if(t.k=='drop'&&t.on){t.vy+=.4;t.y=Math.min(t.y+t.vy,306)}
if((t.k=='spike'&&(!t.hid||t.on))||t.k=='drop'){
if(hit({x:P.x+2,y:P.y+2,w:P.w-4,h:P.h-4},{x:t.x+4,y:t.y+4,w:t.w-8,h:t.h-4}))die()}}
if(P.y>H+40&&!cd)die();
if(!cd&&hit(P,{x:L.d[0],y:L.d[1],w:20,h:20})){
done=Math.max(done,lv+1);try{localStorage.setItem('atf',done)}catch(e){}
lv++;
if(lv%20==0){run=0;const p=lv/20;menu(lv>=60?'مبروك! أنهيت اللعبة كاملة 🏆':'أنهيت الجزء '+p+' 🎉 فُتح الجزء التالي')}else load()}}
function c(a,b,r){x.beginPath();x.arc(a,b,r,0,7);x.fill()}
function draw(){const p=lv/20|0,t=TH[p];T++;
const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,t.s1);g.addColorStop(1,t.s2);x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle=p==2?'#fff6c8':'#fff3a0';c(540,70,26);
if(p==2){x.fillStyle='#fff';for(let i=0;i<40;i++){x.globalAlpha=.4+.6*Math.abs(Math.sin(T/40+i));x.fillRect((i*97)%W,(i*53)%200,2,2)}x.globalAlpha=1}
else{x.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<4;i++){const a=((i*190+T*.2)%(W+120))-60,b=50+i*28;c(a,b,16);c(a+18,b+4,13);c(a-16,b+5,11)}}
x.fillStyle=t.h;x.beginPath();x.moveTo(0,320);for(let i=0;i<=W;i+=20)x.lineTo(i,260+Math.sin(i/70+p)*22+Math.sin(i/23)*6);x.lineTo(W,320);x.fill();
for(const q of L.p)if(q){x.fillStyle=t.b;x.fillRect(q[0],q[1],q[2],q[3]);x.fillStyle='rgba(0,0,0,.18)';for(let i=q[0]+10;i<q[0]+q[2];i+=20)x.fillRect(i,q[1]+8,2,q[3]-8);x.fillStyle=t.g;x.fillRect(q[0],q[1],q[2],6);x.fillStyle='rgba(255,255,255,.35)';for(let i=q[0]+4;i<q[0]+q[2];i+=12)x.fillRect(i,q[1]+1,6,2)}
x.fillStyle=t.o;x.strokeStyle='#fff';x.lineWidth=1;
for(const s of L.t)if((s.k=='spike'&&(!s.hid||s.on))||s.k=='drop'){
const n=Math.max(1,Math.round(s.w/14)),w=s.w/n;
for(let i=0;i<n;i++){x.beginPath();
if(s.k=='drop'){x.moveTo(s.x+i*w,s.y);x.lineTo(s.x+(i+1)*w,s.y);x.lineTo(s.x+(i+.5)*w,s.y+s.h)}
else{x.moveTo(s.x+i*w,s.y+s.h);x.lineTo(s.x+(i+1)*w,s.y+s.h);x.lineTo(s.x+(i+.5)*w,s.y)}
x.closePath();x.fill();x.stroke()}}
const d=L.d;x.fillStyle='#6b3fa0';x.fillRect(d[0]-3,d[1]-3,26,23);c(d[0]+10,d[1]-3,13);
x.fillStyle='#ffd23f';x.fillRect(d[0],d[1],20,20);c(d[0]+10,d[1],10);x.fillStyle='#b0361f';x.fillRect(d[0]+8,d[1]+8,4,12);x.fillStyle='#fff';c(d[0]+15,d[1]+12,1.5);
if(!cd||cd%4<2){x.fillStyle='#ffd23f';x.fillRect(P.x,P.y,P.w,P.h);x.fillStyle='#e8364f';x.fillRect(P.x-1,P.y-2,P.w+2,6);x.fillStyle='#fff';const f=P.vx<0?-1:1;x.fillRect(P.x+3+f,P.y+8,4,4);x.fillRect(P.x+8+f,P.y+8,4,4);x.fillStyle='#10131c';x.fillRect(P.x+5+f*2,P.y+9,2,2);x.fillRect(P.x+10+f*2,P.y+9,2,2)}
x.font='bold 13px sans-serif';x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=4;
x.textAlign='right';x.fillText('الجزء '+(p+1)+' · المرحلة '+(lv%20+1)+'/20 · '+L.n,W-10,20);
x.textAlign='left';x.fillText('💀 '+dead,10,20);x.shadowBlur=0}
function loop(){if(run){step();draw()}requestAnimationFrame(loop)}
function menu(msg){document.getElementById('ov').style.display='flex';document.getElementById('m').textContent=msg||'اختر الجزء وابدأ التحدي';
const pr=document.getElementById('pr');pr.innerHTML='';
TH.forEach((t,p)=>{const b=document.createElement('button'),ok=done>=20*p;b.className='pb'+(ok?'':' lk');b.style.background=t.c;
b.innerHTML='الجزء '+(p+1)+'<br>'+t.n+'<small>'+(ok?Math.min(20,Math.max(0,done-20*p))+' / 20':'🔒 أكمل الجزء السابق')+'</small>';
if(ok)b.onclick=()=>start(p);pr.appendChild(b)})}
function start(p){lv=done>=20*(p+1)?20*p:Math.max(done,20*p);dead=0;load();document.getElementById('ov').style.display='none';run=1}
document.getElementById('mb').onclick=()=>{run=0;menu('')};
const km={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'j',w:'j',' ':'j'};
addEventListener('keydown',e=>{const k=km[e.key];if(k){K[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=km[e.key];if(k)K[k]=0});
[['bl','l'],['br','r'],['bj','j']].forEach(([id,k])=>{const b=document.getElementById(id);
b.onpointerdown=e=>{e.preventDefault();K[k]=1};
['pointerup','pointerleave','pointercancel'].forEach(ev=>b['on'+ev]=()=>K[k]=0)});
addEventListener('contextmenu',e=>e.preventDefault());
lv=0;load();draw();menu('');loop();
</script>
</body>
</html>
